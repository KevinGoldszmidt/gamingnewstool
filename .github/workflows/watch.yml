name: Gaming News Watch

on:
  schedule:
    # 10:00, 15:00, 21:00 Europe/Madrid time (CEST, UTC+2 in summer).
    # Written in UTC below, so these drift by an hour once Spain
    # switches to CET (UTC+1) in late October, that's a GitHub Actions
    # limitation, cron can't follow a local timezone directly.
    - cron: "0 8 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated seen.json
        run: |
          git config user.name "gaming-news-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen state [skip ci]"
          git push
